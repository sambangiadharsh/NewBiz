<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Saamaan | Modern Minimalist E-Commerce Storefront</title>
    <meta name="description" content="Discover curated modern essentials, tech, fashion, and lifestyle collections with fast delivery and premium service." />
  </head>
  <body class="bg-canvas text-dark-800 antialiased min-h-screen selection:bg-primary-600 selection:text-white font-sans">
    <!-- Google Translate Headless Mount Element -->
    <div id="google_translate_element" style="display:none" class="notranslate" translate="no"></div>

    <div id="root"></div>

    <!-- Google Translate Initialization Script -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          var el = document.getElementById('google_translate_element');
          if (el) el.innerHTML = '';
          new window.google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'en,hi,bn,gu,ta,te,kn,or',
              layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
              autoDisplay: false
            },
            'google_translate_element'
          );
        }
      };
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
